name: Delivery conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: Delivery conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out delivery candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Verify JSON, locks, checksums, and catalog declaration
        run: |
          bash tools/verify-ci-inputs.sh
          bash tools/verify-ci-inputs.test.sh
          bash tools/verify-evidence.sh
          bash tools/verify-evidence.test.sh

      - name: Verify Studio acceptance matrix and copied context artifacts
        run: |
          set -euo pipefail
          for artifact in \
            contract-artifact/workflow-context-association-v1 \
            contract-artifact/workflow-context-binding-catalog-v1 \
            contract-artifact/workflow-provider-session-projection-v1; do
            (cd "$artifact" && sha256sum --strict --check SHA256SUMS)
          done
          jq --exit-status '
            (.features | length == 22) and
            (.features | [.[].row_id] | length == (unique | length)) and
            (.features | all(.[]; (.outcome != "complete") and
              (.required_companion_prs | type == "array") and
              (.exact_merged_pins | type == "array") and
              (.schema_capability_versions | type == "array") and
              (.commands_ci_evidence | type == "array") and
              (.remaining_acceptance_gates | type == "array"))) and
            (.backend_children | length == 21) and
            (.owner_feature_pr_dispositions | length == 22) and
            (.dependency_graph.acyclic == true) and
            (.evidence_lanes.provider.status == "unverified") and
            (.evidence_lanes.native_game.status == "unverified")
            ' docs/evidence/studio-acceptance-matrix-20260913.json
          jq --exit-status '
            (.issue_states | length == 43) and
            (.artifact_digests | length >= 20)
          ' integration/source-lock-20260913.json
          while IFS=$'\t' read -r path expected; do
            test "$(sha256sum "$path" | awk '{print $1}')" = "$expected"
          done < <(jq -r '.artifact_digests[] | [.path, .sha256] | @tsv' integration/source-lock-20260913.json)

      - name: Build and test independent conformance tools from locks
        run: |
          cargo +1.97.1 test --locked --manifest-path tools/conformance-driver/Cargo.toml
          cargo +1.97.1 build --locked --manifest-path tools/conformance-driver/Cargo.toml
          cargo +1.97.1 test --locked --manifest-path tools/recorded-run-driver/Cargo.toml
          cargo +1.97.1 build --locked --manifest-path tools/recorded-run-driver/Cargo.toml

      # This is a deliberately unmerged candidate recorded in candidate-lock.json,
      # not a claim that its default branch has that revision.
      - name: Check out exact harness candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-harness
          ref: 6e0272511997165ebba337a15d22f73acd36a4c4
          path: harness
          persist-credentials: false

      - name: Build exact harness management binary
        working-directory: harness
        run: cargo +1.97.1 build --locked --bin sts2-workflow

      - name: Assert checked-out harness lock and record binary digest
        run: |
          expected=$(jq -r '.candidate_revisions[] | select(.repository == "AI-Ascension/sts2-harness") | .commit' integration/candidate-lock.json)
          test "$expected" = 6e0272511997165ebba337a15d22f73acd36a4c4
          test "$(git -C harness rev-parse HEAD)" = "$expected"
          sha256sum harness/target/debug/sts2-workflow

      - name: Exercise real synthetic process conformance
        run: |
          tools/conformance-driver/target/debug/ascension-conformance-driver \
            --binary "$GITHUB_WORKSPACE/harness/target/debug/sts2-workflow" \
            --catalog "$GITHUB_WORKSPACE/workflows/sts2" \
            --capabilities "$GITHUB_WORKSPACE/catalog/capabilities/synthetic-full.json" \
            --missing-capabilities "$GITHUB_WORKSPACE/catalog/capabilities/synthetic-missing-map.json" \
            --negative "$GITHUB_WORKSPACE/workflows/sts2/map.strict.json"

      # This merged producer pin supplies the live service's reported target
      # catalog and capability manifest. The separate Harness peer suite owns
      # Gateway/MCP process acceptance and is not rerun by this catalog check.
      - name: Check out merged served-live Harness producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-harness
          ref: f2758655d472da54e1ea05671da5345680f51da1
          path: harness-live
          persist-credentials: false

      - name: Build pinned served-live Harness commands
        working-directory: harness-live
        run: cargo +1.97.1 build --locked --package sts2-harness --bin sts2-harness-runtime --bin sts2-workflow

      - name: Assert merged Harness producer pin
        run: |
          expected=$(jq -r '.producer.merge_commit' integration/served-live-source-lock.json)
          test "$expected" = f2758655d472da54e1ea05671da5345680f51da1
          test "$(git -C harness-live rev-parse HEAD)" = "$expected"

      - name: Compare served production contracts and validate the live graph
        run: |
          umask 022
          tools/conformance-driver/target/debug/served-live-conformance-driver \
            --runtime-binary "$GITHUB_WORKSPACE/harness-live/target/debug/sts2-harness-runtime" \
            --workflow-binary "$GITHUB_WORKSPACE/harness-live/target/debug/sts2-workflow" \
            --definition "$GITHUB_WORKSPACE/conformance/serve-workflow-v1/definition.json" \
            --capability-contract "$GITHUB_WORKSPACE/conformance/serve-workflow-v1/production-capabilities.json" \
            --target-catalog "$GITHUB_WORKSPACE/conformance/serve-workflow-v1/target-catalog.json" \
            --provider-capabilities "$GITHUB_WORKSPACE/conformance/serve-workflow-v1/provider-capabilities-fixture.json"
